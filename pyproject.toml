[project]
name = "scahelm"
version = "0.1.0"
description = "Exploratory fit/coverage toolchain for a family of pressed-steel SCA helms"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy>=1.12", "pandas>=2", "pyyaml", "matplotlib", "trimesh", "rtree", "ezdxf"]

[project.optional-dependencies]
step = ["cadquery-ocp"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
