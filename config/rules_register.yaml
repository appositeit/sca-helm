# SCA armoured (rattan) combat helm rules register
# Scope: Kingdom of Lochac (AU/NZ) + SCA Inc. Society minimums.
# text_type: "quote" = verbatim from source; "paraphrase" = close paraphrase.
# applies_to: armoured = all armoured (rattan) combat; missile = only scenarios with
#   combat archery arrows/bolts (Lochac) ; both = applies in either.
# quantitative: list of {quantity, value, unit, comparator} or null.
# status: verified_current = wording verified on 2026-10-03 in the current source;
#   needs_confirmation = wording verified but which rule governs in Lochac, or its
#   interpretation, is unresolved (see docs/rules_matrix.md "Open questions").
# Design policy suggestion (not a rule): where Lochac v3.4 and Society 2026 differ,
#   design to the stricter of the two.

