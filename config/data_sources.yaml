  - id: niosh_iso_digital_headforms
    name: "NIOSH / ISO 16900-5 digital headforms (small, medium, large, long/narrow, short/wide)"
    status: verified
    population: "Derived from NIOSH 2003 survey scans (5 subjects averaged per size category)"
    sample_size: {headforms: 5, subjects_per_headform: 5}
    collection_date: "2003 scans; STL headers dated Feb-27-2014 (Ls-Prepost)"
    sampling_method: "Subjects with digital PC1/PC2 within 1 SD of category mean of 10 facial dims; aligned (Frankfurt + symmetry), averaged, mirrored"
    scan_coverage: full_head_synthetic
    scan_coverage_notes: >
      Full closed head + neck. Face is averaged scan data; SCALP IS CONSTRUCTED (subjects wore wig
      caps/had hair; bald subjects' contours used, scaled to category mean head length/breadth);
      ears are generic third-party surfaces (Direct Dimensions Inc.) placed at average location;
      neck sized to category neck circumference; 5 mm hole at mouth; symmetric.
    formats: [STL (ASCII), IGS (IGES)]   # PLY mentioned on archive page but NOT in current zip
    files:
      - {name: small_symmetry.stl, triangles: 252263, bbox_extent_mm_xyz: [159.8, 254.3, 210.9], sha256: fe528ebee3b4aa7a80af85c3be6bcde4d69bce94dd0c9e0f64873b446f391362}
