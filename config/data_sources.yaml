      - {name: Long_narrow_symmetry.stl, triangles: 302513, bbox_extent_mm_xyz: [166.0, 278.4, 230.8], sha256: 1c91215f55f870a1b35636b914db9c2803f0556264f576d1e77922323bbf6db5}
      - {name: Short_Wide_symmetry.stl, triangles: 283353, bbox_extent_mm_xyz: [171.5, 262.7, 224.8], sha256: 4aba2459a48ebe84d6c4564e05ec5cc56b08b246d4a6ba614a7ef412cdd0d2c4}
    bbox_notes: "Axis convention not documented; extents include neck. Units assumed mm (unverified)."
    units: "mm (assumed)"
    licence: "As niosh_2003_headface: no explicit licence; US Gov work presumed public domain; ear surfaces are third-party origin (status unverified)"
    access: public
    cost_aud: 0
    download_url: "same zip as niosh_2003_headface (ISOdigital/ folder)"
    limitations_for_lochac: "Only 5 averaged, symmetric shapes; scalp shape is constructed not measured -> weak for cranial vault fitting; good for face/visor clearance and as template meshes."

