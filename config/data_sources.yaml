      sizes 445 to 645 in 10 mm steps (21 sizes); Table 1 gives h, x, y, z reference dimensions
      and mass ranges; normative Annex A gives spherical coordinates (radius vs vertical angle
      -65..+90 deg and horizontal angle 0..180 deg in 15 deg steps) about point R for each size;
      informative Annex B gives radius equations for sizes 495-645.
