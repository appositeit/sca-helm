# Data-source / access / licensing register for sca-helm
# (fitting a family of steel helmet shells to adult heads, external geometry incl. soft tissue)
#
# Compiled: 2026-10-03.  Convention: every value either VERIFIED (checked against the
# source document/file on 2026-10-03) or explicitly marked `unverified`. Nothing is invented;
# unknown values are null with a note.
# Currency conversions use ECB reference rates via api.frankfurter.app dated 2026-10-02:
#   1 EUR = 1.6176 AUD; 1 USD = 1.4411 AUD; 1 NZD = 0.80872 AUD. Conversions are indicative only.
#
# Target population ("Lochac fighters"): adult SCA heavy-combat fighters in Australia/NZ,
# mostly male but not exclusively, broad adult age range, mixed (predominantly European-ancestry,
# unverified) ethnicity, often wearing arming caps/padding under the helmet.

meta:
  schema_version: 1
  compiled: 2026-10-03
  fx_rates_to_aud: {EUR: 1.6176, USD: 1.4411, NZD: 0.80872, date: 2026-10-02, source: "https://api.frankfurter.app/latest"}
  status_values: [verified, partially_verified, unverified]

sources:

  # ---------------------------------------------------------------------------
  - id: ansur2_2012
    name: "ANSUR II - 2012 US Army Anthropometric Survey, public working databases"
    status: verified
    population: "US Army personnel (Regular Army, Army National Guard, Army Reserve), Oct 2010 - Apr 2012"
    sample_size:
      public_files: {male: 4082, female: 1986, total: 6068}      # verified by row count
      full_survey: {male: 7435, female: 3922}                    # from TR15-007 abstract
    age_range_years: [17, 58]                                    # verified from Age column (both sexes)
    collection_date: "2010-10-04 to 2012-04-05"                  # MFR memo, 14 Apr 2017
    sampling_method: >
      Full survey was not representative. Public 'working databases' are stratified random
      subsamples (separately per sex) matched on age, race/ethnicity and component to DMDC Army
      census of 30 Sep 2011 (Reserve pooled with Guard); of 5 candidate draws, the one closest to
      weighted parameter estimates was chosen (TR15-007 p.33). Effectively self-weighting for the
      2011 Total Army; NO per-subject sampling-weight column is provided.
    sampling_weights: >
      None. 'Weightlbs' is SELF-REPORTED BODY WEIGHT in pounds (min 0 in male file = missing), and
      'Heightin' is self-reported height; neither is a sampling weight. 'weightkg' is MEASURED body
      mass in units of 0.1 kg (hectograms) despite its name.
    exclusions: >
      Acromion-wall depth dropped (93 of 94 measured dimensions released). Not otherwise documented
      in the parts read (unverified). Female soldiers with braids/cornrows measured WITH hair for
      head breadth, head circumference, head length, tragion-top of head (no significant mean
      difference per report); buns/French braids were taken down.
    measurement_definitions: "ANSUR II TR15-007 (Gordon et al. 2014) + MFR memo; manual anthropometry (calipers, tape)"
    head_columns:   # exact CSV column names (identical in both files except ID column case)
      headcircumference: "max circumference above ear attachment, tape just above brow ridges"
      headlength: "glabella to opisthocranion, spreading caliper"
      headbreadth: "max horizontal breadth above ear attachment, spreading caliper"
      tragiontopofhead: "vertical distance R tragion to plane tangent to top of head, Frankfurt plane, beam caliper"
      bitragionchinarc: "surface arc R-L tragion across chin, tape"
      bitragionsubmandibulararc: "surface arc R-L tragion across submandibular landmark, tape"
      bizygomaticbreadth: "max face breadth at zygia, spreading caliper"
      mentonsellionlength: "menton to sellion, sliding caliper"
      earbreadth: null
      earlength: null
      earprotrusion: null
      interpupillarybreadth: "pupillometer; NOTE values 510-770 imply units of 0.1 mm although memo says mm (unverified)"
      neckcircumference: null
      neckcircumferencebase: null
    head_columns_absent: [sagittal arc, bitragion coronal arc, bitragion frontal arc, head height/vertex-menton, minimum frontal breadth]
    other_columns_of_use: [stature, weightkg, sittingheight, Gender, Age, DODRace, SubjectNumericRace, Ethnicity, Component, Branch, Installation, Date, SubjectsBirthLocation]
    scan_coverage: none_public   # 3D head/foot/whole-body scans exist but are NOT public (privacy)
    units: "mm (except weightkg = 0.1 kg; interpupillarybreadth apparently 0.1 mm - unverified)"
    licence: "US Government work; MFR memo: 'reviewed and cleared for UNLIMITED PUBLIC RELEASE'; reports 'Approved for public release; distribution is unlimited'"
    licence_decision: "Redistribution/local copy permitted -> raw CSVs stored unmodified in data/raw/ansur2/"
    access: public
    cost_aud: 0
    landing_page: "https://www.openlab.psu.edu/ansur2/"
    downloads:
      - url: "https://tools.openlab.psu.edu/publicData/ANSUR_II_MALE_Public.csv"
        http_status: 200
        bytes: 2000794
        rows: 4082
        columns: 108
        sha256: 0547aea0170e5293de519389981135e75803f02e6d40c77ace740decc0caac64
        local_path: data/raw/ansur2/ANSUR_II_MALE_Public.csv
        notes: "ID column 'subjectid'; contains one non-UTF-8 (Latin-1 0xE9) byte -> read with encoding latin-1"
      - url: "https://tools.openlab.psu.edu/publicData/ANSUR_II_FEMALE_Public.csv"
        http_status: 200
        bytes: 976573
        rows: 1986
        columns: 108
        sha256: ed7e800aa97a4d42f8286b988be2fe1883a2e789588169db959864b707d1757a
        local_path: data/raw/ansur2/ANSUR_II_FEMALE_Public.csv
        notes: "ID column 'SubjectId' (different case from male file)"
      - url: "https://tools.openlab.psu.edu/publicData/ANSURII-TR15-007.pdf"
        notes: "Methods & summary statistics report (7.3 MB); not stored"
      - url: "https://tools.openlab.psu.edu/publicData/ANSURII-MFR.pdf"
        notes: "Variable dictionary memo (14 Apr 2017); not stored"
    note_wrong_url: "Filenames with spaces ('ANSUR II MALE Public.csv') under openlab.psu.edu/wp-content/... returned 404 / connection reset; use the tools.openlab.psu.edu URLs above."
    observed_summary_mm:   # computed from downloaded files, mean (SD) [min-max]
      male:   {headcircumference: "574.4 (16.0) [516-633]", headlength: "199.5 (7.0) [172-225]", headbreadth: "154.3 (5.5) [135-180]", tragiontopofhead: "131.1 (6.2) [110-150]"}
      female: {headcircumference: "561.1 (19.4) [500-635]", headlength: "189.8 (7.4) [168-215]", headbreadth: "147.8 (5.2) [131-167]", tragiontopofhead: "126.5 (6.5) [105-148]"}
    limitations_for_lochac: >
      US military (fit, young-skewed, age <=58, ~1/3 female in public file only because of
      separate files), US racial mix (large Black/Hispanic share) differs from AU/NZ; no scans;
      no sagittal/coronal arcs so crown shape must be inferred; manual caliper values compress
      hair/soft tissue slightly; no padding/arming cap allowance.

