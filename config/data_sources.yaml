  # ---------------------------------------------------------------------------
  - id: niosh_2003_headface
    name: "NIOSH 2003 Head-and-Face Anthropometric Survey of US Respirator Users (Zhuang & Bradtmiller 2005) - individual records"
    status: verified
    population: "US civilian workers who use respirators; 41 sites in 8 states"
    sample_size: {total: 3997, male: 2543, female: 1454, scanned_subset_csv_rows: 946}
    sample_size_notes: >
      All-subjects CSV has 3997 records (+2 blank trailing rows). Methods PDF says 1,013 were
      3-D scanned (San Diego, Houston); CDC page text says 947; scanned-subjects CSV has 946 rows.
    collection_date: "2003"
    sampling_method: >
      Stratified, equal-cell design: 3 age (18-29, 30-44, 45-66) x 2 sex x 4 race (White, Black,
      Hispanic, Other), target 166/cell (ISO 15535). Minorities deliberately oversampled; NIOSH
      intended to re-weight by age/race to the workforce. No weight column in the CSV.
      (Data dictionary codes AGEGRP 1 as 17-29.)
    exclusions: "3994 of 3997 used for PCA (missing face width / IPD); NECKCIRC added mid-study (many -9999)"
    measurement_definitions: "Clauser et al.; manual calipers/tape; Data dictionary in zip (pdfs/DataDictionary-508.pdf)"
    head_columns: [HEADCIRC, BITCOR, BITFRONT, BITSUBN, BITCHIN, NECKCIRC, HEADBR, HEADLTH, MINFRBR, MAXFRBR, BIZYGOBR, BIGONLBR, NROOTBR, NOSEBR, LIPLTH, SUBNASAL, MENSELL, NOSEPRO, INTPUPBR]
    other_columns: [SUBNO, SEX, AGEGRP, RACEGRP, WEIGHTKG, STATURE]
    head_columns_absent: [sagittal arc, tragion-top of head / head height]
    missing_code: "-9,999 (thousands separators present in some numeric fields, e.g. '1,689')"
    scan_coverage: none   # individual 3D scans are NOT in the download; only the 5 averaged headforms
    units: "mm; WEIGHTKG kg"
    licence: "No explicit licence stated on data.cdc.gov (license: null). US federal government work - presumed public domain (17 USC 105) - unverified"
    access: public
    cost_aud: 0
    landing_page: "https://archive.cdc.gov/www_cdc_gov/niosh/npptl/topics/respirators/headforms/default.html"
    dataset_page: "https://data.cdc.gov/dataset/NIOSH-Anthropometric-Data-and-ISO-Digital-Headform/c2hx-eeis/about_data  (redirect from https://www.cdc.gov/niosh/data/datasets/rd-10130-2020-0/default.html)"
    downloads:
      - url: "https://data.cdc.gov/api/views/c2hx-eeis/files/4b4cb188-f59c-490a-8ab1-67528503554a?filename=rd-10130-2020-0.zip"
        http_status: 200
        bytes: 68582780
        sha256: f8633144d49cfd64aea2305edf8244d25d32bf12af596456e00f91ae1d5c5e8b
        stored: false
        contents:
          - {path: datasets/RespiratorUsersData-all-subjects.csv, bytes: 408906, sha256: 0f70a4081151da845b8c4de897691ea9502d5ca682bf58f3dcc41a86c5a1a9f7}
          - {path: datasets/RespiratorUsers-scanned-subjects.csv, bytes: 87837, sha256: 656e95d67b96ddc6de8b6d86f0da4bec784f823baaf883696f8af73bd9be1cc1}
          - {path: pdfs/DataDictionary-508.pdf}
          - {path: pdfs/MaterialsMethodsAnthropometricData-508.pdf}
          - {path: pdfs/MaterialsMethodsISODigitalHeadforms-508.pdf}
    note_previous_statement: "Archived CDC page says 2D/3D data 'available ... for those who complete the data use agreements'; the current data.cdc.gov zip contains the individual 2D table openly (no DUA encountered)."
    observed_summary_mm:
      male:   {HEADCIRC: "576.1 (17.5) [520-639]", HEADLTH: "197.4 (7.5)", HEADBR: "153.1 (6.0)", BITCOR: "350.7 (14.1)"}
      female: {HEADCIRC: "558.7 (20.7) [475-654]", HEADLTH: "187.6 (7.6)", HEADBR: "147.0 (5.8)", BITCOR: "341.0 (15.6)"}
    limitations_for_lochac: >
      US civilian workers (broader age to 66 and body size than military - closer to Lochac than
      ANSUR in that respect); race-stratified not proportional; face-focused dimension set, only
      HEADCIRC/HEADLTH/HEADBR/BITCOR describe the helmet-bearing cranium; age given only in 3 bands.

